DATA:
  BATCH_SIZE: 128
  DATASET: "medium_imagenet"
  IMG_SIZE: 128
  NUM_WORKERS: 16
  PIN_MEMORY: True
MODEL:
  NAME: resnet50_pretrained
  NUM_CLASSES: 200
  DROP_RATE: 0.0
TRAIN:
  EPOCHS: 10
  WARMUP_EPOCHS: 0
  LR: 1e-4
  MIN_LR: 1e-6
  WARMUP_LR: 1e-6
  WEIGHT_DECAY: 0.05
  LR_SCHEDULER:
    NAME: "cosine"
  OPTIMIZER:
    NAME: "adamw"
    EPS: 1e-8
    BETAS: [0.9, 0.999]
    MOMENTUM: 0.9
OUTPUT: "output/resnet50_pretrained_medium_imagenet"
SAVE_FREQ: 5
PRINT_FREQ: 99999
