AUG:
  COLOR_JITTER: 0.4
  SCHEME: crop_erase
DATA:
  BATCH_SIZE: 256
  DATASET: "cifar10"
  IMG_SIZE: 32
  NUM_WORKERS: 16
  PIN_MEMORY: True
MODEL:
  NAME: resnet18
  NUM_CLASSES: 10
  DROP_RATE: 0.0
TRAIN:
  EPOCHS: 50
  WARMUP_EPOCHS: 0
  LR: 1e-3
  MIN_LR: 1e-5
  WARMUP_LR: 1e-6
  WEIGHT_DECAY: 0.05
  LR_SCHEDULER:
    NAME: "cosine"
  OPTIMIZER:
    NAME: "adamw"
    EPS: 1e-8
    BETAS: [0.9, 0.999]
    MOMENTUM: 0.9
OUTPUT: "output/resnet18_cifar"
SAVE_FREQ: 5
PRINT_FREQ: 99999
