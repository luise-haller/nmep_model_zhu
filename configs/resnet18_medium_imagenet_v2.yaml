AUG:
  SCHEME: strong
DATA:
  BATCH_SIZE: 256
  DATASET: "medium_imagenet"
  IMG_SIZE: 64
  NUM_WORKERS: 16
  PIN_MEMORY: True
MODEL:
  NAME: resnet18
  NUM_CLASSES: 200
  DROP_RATE: 0.0
TRAIN:
  EPOCHS: 40
  WARMUP_EPOCHS: 0
  LR: 1e-3
  MIN_LR: 1e-5
  WARMUP_LR: 1e-6
  WEIGHT_DECAY: 0.05
  LABEL_SMOOTHING: 0.1
  LR_SCHEDULER:
    NAME: "cosine"
  OPTIMIZER:
    NAME: "adamw"
    EPS: 1e-8
    BETAS: [0.9, 0.999]
    MOMENTUM: 0.9
OUTPUT: "output/resnet18_medium_imagenet_v2"
SAVE_FREQ: 5
PRINT_FREQ: 99999
